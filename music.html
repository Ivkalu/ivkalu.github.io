<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivkalu Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/portfolio.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/music.css">
 
  </head>
  <body>
    <header>
      <h1>Ivkalu Music</h1>
      <p></p>
      <div class="contact">
        <a href="index.html">Back to portfolio</a>
    </div>
    </header>
    
    <section>
    
    <p>I imagine a future where musicians can simply describe their vision to <strong>AI</strong>, and the AI fine-tunes the ideal synth or virtual instrument to match the sound they’re after. I believe this future isn’t far off, and I want to help make it a reality.</p>
    
    
    
    <div id="songs"></div>

    </section>
    <script>
      // Song list is generated from the subfolders of assets/songs (see .github/scripts/generate_songs.py)
      fetch('assets/songs.json', { cache: 'no-cache' })
        .then(response => response.json())
        .then(categories => {
          const container = document.getElementById('songs');
          for (const category of categories) {
            const heading = document.createElement('p');
            const strong = document.createElement('strong');
            strong.textContent = category.name;
            heading.appendChild(strong);

            const list = document.createElement('ul');
            for (const song of category.songs) {
              const item = document.createElement('li');
              const link = document.createElement('a');
              link.href = 'bouncer.html?song=' + encodeURIComponent(song.path);
              link.textContent = song.title;
              item.appendChild(link);
              list.appendChild(item);
            }

            container.append(heading, list);
          }
        });
    </script>
  </body>
  
</html>
