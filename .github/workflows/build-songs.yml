name: Build song list

on:
  push:
    paths:
      - 'assets/songs/**'
      - '.github/scripts/generate_songs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-songs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Prevent infinite loops when the workflow commits the generated JSON back.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate assets/songs.json
        run: python3 .github/scripts/generate_songs.py

      - name: Commit songs.json
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/songs.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "workflow commit: update song list [skip ci]"
          git push
