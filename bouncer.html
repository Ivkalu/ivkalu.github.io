<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivkalu Music</title>
    <link rel="stylesheet" href="assets/css/bouncer.css">
  </head>
  <body>
    <div class="top-controls">
      <a href="music.html" class="pill-button" aria-label="Back to music">
        <svg viewBox="0 0 16 16"><path d="M10.53 2.47a.75.75 0 0 1 0 1.06L6.06 8l4.47 4.47a.75.75 0 1 1-1.06 1.06l-5-5a.75.75 0 0 1 0-1.06l5-5a.75.75 0 0 1 1.06 0z"/></svg>
        <span>Music</span>
      </a>
      <button class="pill-button icon-only" id="sidebarToggle" aria-label="Show song list" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 16 16"><path d="M1 3.75A.75.75 0 0 1 1.75 3h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 3.75zm0 4.25a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 8zm.75 3.5a.75.75 0 0 0 0 1.5h12.5a.75.75 0 0 0 0-1.5H1.75z"/></svg>
      </button>
    </div>
    <audio id="audioPlayer" preload="metadata"></audio>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="panel sidebar" id="sidebar" aria-label="Song list">
      <div class="panel-header">
        <h2>Songs</h2>
        <button class="control" id="sidebarClose" aria-label="Close song list">
          <svg viewBox="0 0 16 16"><path d="M2.47 2.47a.75.75 0 0 1 1.06 0L8 6.94l4.47-4.47a.75.75 0 1 1 1.06 1.06L9.06 8l4.47 4.47a.75.75 0 1 1-1.06 1.06L8 9.06l-4.47 4.47a.75.75 0 0 1-1.06-1.06L6.94 8 2.47 3.53a.75.75 0 0 1 0-1.06z"/></svg>
        </button>
      </div>
      <nav class="song-list" id="songList"></nav>
    </aside>

    <aside class="panel queue-panel" id="queuePanel" aria-label="Queue">
      <div class="panel-header">
        <h2>Queue</h2>
        <button class="control" id="queueClose" aria-label="Close queue">
          <svg viewBox="0 0 16 16"><path d="M2.47 2.47a.75.75 0 0 1 1.06 0L8 6.94l4.47-4.47a.75.75 0 1 1 1.06 1.06L9.06 8l4.47 4.47a.75.75 0 1 1-1.06 1.06L8 9.06l-4.47 4.47a.75.75 0 0 1-1.06-1.06L6.94 8 2.47 3.53a.75.75 0 0 1 0-1.06z"/></svg>
        </button>
      </div>
      <div class="song-list" id="queueList"></div>
    </aside>

    <div class="toast" id="toast" role="status"></div>

    <div class="circle" style="background-color:#BADA55"></div>
    <div class="wave"></div>

    <div class="playbar" id="playbar">
      <div class="playbar-title" id="songTitle"></div>

      <div class="playbar-center">
        <div class="playbar-controls">
          <button class="control toggle" id="shuffleButton" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 16 16"><path d="M13.15 1.04a.75.75 0 0 1 1.06 0l1.58 1.58a.75.75 0 0 1 0 1.06l-1.58 1.58a.75.75 0 1 1-1.06-1.06l.3-.3h-.43a2.75 2.75 0 0 0-2.34 1.31L7.03 11a4.25 4.25 0 0 1-3.62 2H.75a.75.75 0 0 1 0-1.5h2.66a2.75 2.75 0 0 0 2.34-1.31l3.65-5.84A4.25 4.25 0 0 1 13.02 2.3h.43l-.3-.3a.75.75 0 0 1 0-1.06zM.75 3a.75.75 0 0 0 0 1.5h2.66c.6 0 1.17.2 1.63.54l.84-1.34A4.25 4.25 0 0 0 3.41 3H.75zm9.37 7.46.84-1.34c.46.35 1.03.55 1.63.55h.43l-.3-.3a.75.75 0 1 1 1.06-1.06l1.58 1.58a.75.75 0 0 1 0 1.06l-1.58 1.58a.75.75 0 1 1-1.06-1.06l.3-.3h-.43a4.25 4.25 0 0 1-2.47-.7z"/></svg>
          </button>
          <button class="control" id="prevButton" aria-label="Previous song">
            <svg viewBox="0 0 16 16"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.74a.7.7 0 0 1 1.05.6v12.58a.7.7 0 0 1-1.05.6L4 9.15v5.15a.7.7 0 0 1-1.4 0V1.7a.7.7 0 0 1 .7-.7z"/></svg>
          </button>
          <button class="control play" id="playButton" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 16 16"><path d="M3 1.71a.7.7 0 0 1 1.05-.6l10.89 6.3a.7.7 0 0 1 0 1.2L4.05 14.89A.7.7 0 0 1 3 14.29V1.71z"/></svg>
            <svg class="icon-pause" viewBox="0 0 16 16"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
          </button>
          <button class="control" id="nextButton" aria-label="Next song">
            <svg viewBox="0 0 16 16"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.11A.7.7 0 0 0 1 1.71v12.58a.7.7 0 0 0 1.05.6L12 9.15v5.15a.7.7 0 0 0 1.4 0V1.7a.7.7 0 0 0-.7-.7z"/></svg>
          </button>
          <button class="control toggle" id="repeatButton" aria-label="Repeat: off">
            <svg viewBox="0 0 16 16"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1 1.01a.75.75 0 0 1-1.06 1.06L7.33 13.15a.75.75 0 0 1 0-1.06l2.42-2.42a.75.75 0 1 1 1.06 1.06l-1 1.01h2.44a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"/></svg>
            <span class="repeat-one">1</span>
          </button>
        </div>

        <div class="playbar-progress">
          <span class="time" id="currentTime">0:00</span>
          <input type="range" class="slider" id="seekBar" min="0" max="0" step="0.1" value="0" aria-label="Seek">
          <span class="time" id="duration">0:00</span>
        </div>
      </div>

      <div class="playbar-right">
        <button class="control toggle" id="queueButton" aria-label="Queue" aria-pressed="false" aria-controls="queuePanel">
          <svg viewBox="0 0 16 16"><path d="M15 15H1v-1.5h14V15zm0-4.5H1V9h14v1.5zm-14-7A2.5 2.5 0 0 1 3.5 1h9a2.5 2.5 0 0 1 0 5h-9A2.5 2.5 0 0 1 1 3.5zm2.5-1a1 1 0 0 0 0 2h9a1 1 0 1 0 0-2h-9z"/></svg>
        </button>
        <div class="playbar-volume">
          <svg viewBox="0 0 16 16"><path d="M9.74 2.07A.75.75 0 0 1 10.12 2.72v10.56a.75.75 0 0 1-1.18.62L4.89 11H1.75A.75.75 0 0 1 1 10.25v-4.5A.75.75 0 0 1 1.75 5h3.14l4.05-2.9a.75.75 0 0 1 .8-.03zM12 5.5a3.5 3.5 0 0 1 0 5v-5z"/></svg>
          <input type="range" class="slider" id="volumeBar" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
      </div>
    </div>

    <!-- Back to Portfolio Link -->
    <!--<a href="portfolio.html">Back to Portfolio</a>-->

    <script src="assets/scripts/script.js"></script>
  </body>
</html>
